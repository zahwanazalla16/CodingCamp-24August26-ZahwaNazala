<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header class="dashboard-header">
    <h1 class="dashboard-title">Life Dashboard</h1>
    <button id="theme-toggle" class="btn btn-secondary" aria-label="Toggle light/dark mode">
      🌙 Dark Mode
    </button>
  </header>

  <!-- ===== MAIN GRID ===== -->
  <main class="dashboard-grid">

    <!-- ===== GREETING WIDGET ===== -->
    <section class="widget widget-greeting" aria-label="Greeting and clock">
      <div class="greeting-clock">
        <p id="time-display" class="time-display" aria-live="polite" aria-label="Current time">--:--:--</p>
        <p id="date-display" class="date-display">Date unavailable</p>
        <p id="greeting-text" class="greeting-text">Good Morning!</p>
      </div>
      <div class="name-row">
        <label for="user-name-input" class="sr-only">Your name</label>
        <input
          type="text"
          id="user-name-input"
          class="input"
          placeholder="Enter your name…"
          maxlength="60"
          aria-label="Enter your name for the greeting"
        />
        <button id="user-name-btn" class="btn btn-accent" aria-label="Save name">Save Name</button>
      </div>
    </section>

    <!-- ===== TIMER WIDGET ===== -->
    <section class="widget widget-timer" aria-label="Pomodoro focus timer">
      <h2 class="widget-title">Focus Timer</h2>
      <p id="timer-display" class="timer-display" aria-live="polite" aria-label="Timer countdown">25:00</p>

      <!-- Alert banner (hidden by default) -->
      <div id="timer-alert" class="timer-alert" role="alert" aria-live="assertive">
        <span>⏰ Time's up! Great work!</span>
        <button class="btn btn-secondary btn-sm" id="timer-alert-dismiss" aria-label="Dismiss alert">Dismiss</button>
      </div>

      <!-- Timer controls -->
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-accent" aria-label="Start or resume timer">Start</button>
        <button id="timer-stop"  class="btn btn-secondary" disabled aria-label="Pause timer">Pause</button>
        <button id="timer-reset" class="btn btn-secondary" aria-label="Reset timer">Reset</button>
      </div>

      <!-- Custom duration -->
      <div class="duration-row">
        <label for="timer-duration-input" class="label-inline">Set duration (min):</label>
        <input
          type="number"
          id="timer-duration-input"
          class="input input-sm"
          min="1"
          max="99"
          placeholder="25"
          aria-label="Custom Pomodoro duration in minutes"
        />
        <button id="timer-duration-btn" class="btn btn-secondary btn-sm" aria-label="Apply custom duration">Set</button>
      </div>
    </section>

    <!-- ===== TASK LIST WIDGET ===== -->
    <section class="widget widget-tasks" aria-label="Task list">
      <h2 class="widget-title">Tasks</h2>

      <!-- Add task row + sort control -->
      <div class="task-toolbar">
        <label for="task-input" class="sr-only">New task</label>
        <input
          type="text"
          id="task-input"
          class="input"
          placeholder="Add a new task…"
          maxlength="500"
          aria-label="New task text"
        />
        <button id="task-add-btn" class="btn btn-accent" aria-label="Add task">Add</button>
        <button id="task-sort-btn" class="btn btn-secondary" aria-label="Toggle task sort order">Sort: A→Z</button>
      </div>
      <!-- Inline error (hidden by default) -->
      <p id="task-error" class="error-msg" aria-live="polite" hidden>Task text cannot be empty or exceed 500 characters.</p>

      <!-- Task list -->
      <ul id="task-list" class="task-list" aria-label="Your tasks"></ul>
    </section>

    <!-- ===== QUICK LINKS WIDGET ===== -->
    <section class="widget widget-links" aria-label="Quick links">
      <h2 class="widget-title">Quick Links</h2>

      <!-- Add link row -->
      <div class="input-row input-row-3">
        <label for="link-label-input" class="sr-only">Link label</label>
        <input
          type="text"
          id="link-label-input"
          class="input"
          placeholder="Label"
          aria-label="Link label"
        />
        <label for="link-url-input" class="sr-only">Link URL</label>
        <input
          type="url"
          id="link-url-input"
          class="input"
          placeholder="https://…"
          aria-label="Link URL"
        />
        <button id="link-add-btn" class="btn btn-accent" aria-label="Add quick link">Add</button>
      </div>
      <!-- Inline error (hidden by default) -->
      <p id="link-error" class="error-msg" aria-live="polite" hidden>Please provide a label and a valid http/https URL.</p>

      <!-- Links container -->
      <div id="quick-links-list" class="quick-links-list" aria-label="Your quick links"></div>
    </section>

  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
